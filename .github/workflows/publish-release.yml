name: Publish release

run-name: Publish RelayFold ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.3.1 or v0.3.1
        required: true
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      image_namespace: ${{ steps.version.outputs.image_namespace }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be SemVer-like, for example 0.3.1 or 0.3.1-rc.1." >&2
            exit 1
          fi

          tag="v$version"
          image_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag does not exist. Create and push the tag before publishing a release." >&2
            exit 1
          fi
          release_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "Using tag $tag at $release_sha."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"

  orchestrator-artifact:
    name: Build orchestrator artifact
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build standalone orchestrator
        uses: docker/build-push-action@v7
        with:
          context: ./orchestrator
          target: artifact
          platforms: linux/amd64
          outputs: type=local,dest=./artifact-root
          cache-from: type=gha,scope=orchestrator-artifact
          cache-to: type=gha,mode=max,scope=orchestrator-artifact

      - name: Package artifact and checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          archive="relayfold-orchestrator-${VERSION}-linux-amd64.tar.gz"
          mkdir -p package release-assets
          install -m 0755 artifact-root/orchestrator package/relayfold-orchestrator
          tar -C package -czf "release-assets/$archive" relayfold-orchestrator
          (
            cd release-assets
            sha256sum "$archive" > "$archive.sha256"
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  images:
    name: Publish ${{ matrix.component }} image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - orchestrator
          - worker
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.image_namespace }}/relayfold-${{ matrix.component }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}-image
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-image

  github-release:
    name: Publish GitHub release
    needs:
      - prepare
      - orchestrator-artifact
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "RelayFold $VERSION" \
            --generate-notes

      - name: Write release summary
        env:
          IMAGE_NAMESPACE: ${{ needs.prepare.outputs.image_namespace }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          {
            echo "## RelayFold $VERSION published"
            echo
            echo "- \`ghcr.io/${IMAGE_NAMESPACE}/relayfold-orchestrator:$VERSION\`"
            echo "- \`ghcr.io/${IMAGE_NAMESPACE}/relayfold-worker:$VERSION\`"
            echo "- Standalone Linux AMD64 orchestrator archive attached to the GitHub Release"
          } >> "$GITHUB_STEP_SUMMARY"
