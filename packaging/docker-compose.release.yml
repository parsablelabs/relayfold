# Canonical Compose template for release images and `rf init`.
services:
  orchestrator:
    image: ${RELAYFOLD_ORCHESTRATOR_IMAGE}
    user: "${RELAYFOLD_WORKER_UID:-10001}:${RELAYFOLD_WORKER_GID:-10001}"
    ports:
      - "${RELAYFOLD_PUBLIC_HTTP_BIND:-127.0.0.1:3000}:3000"
    environment:
      RELAYFOLD_OAUTH_DIR: /var/lib/relayfold/oauth
      RELAYFOLD_USE_GLOBAL_NAMESPACE: "true"
      RELAYFOLD_WORKER_HTTP_ADDR: 0.0.0.0:3001
      RELAYFOLD_STORAGE: ${RELAYFOLD_STORAGE:-sqlite}
      RELAYFOLD_STORE_SQLITE_PATH: ${RELAYFOLD_STORE_SQLITE_PATH:-/tmp/relayfold.db}
      RELAYFOLD_MAX_CONCURRENT_WORKFLOWS: ${RELAYFOLD_MAX_CONCURRENT_WORKFLOWS:-1}
      RELAYFOLD_WORKFLOW_QUEUE_CAPACITY: ${RELAYFOLD_WORKFLOW_QUEUE_CAPACITY:-1024}
      RELAYFOLD_TASK_TIMEOUT_SECS: ${RELAYFOLD_TASK_TIMEOUT_SECS:-300}
    volumes:
      - ${RELAYFOLD_HOME}/oauth:/var/lib/relayfold/oauth
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null && wget -qO- http://127.0.0.1:3001/health >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped

  worker:
    image: ${RELAYFOLD_WORKER_IMAGE}
    user: "${RELAYFOLD_WORKER_UID:-10001}:${RELAYFOLD_WORKER_GID:-10001}"
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      RELAYFOLD_ORCHESTRATOR_HTTP_URL: http://orchestrator:3001
      RELAYFOLD_WORKER_HOST_ID: ${RELAYFOLD_WORKER_HOST_ID:-local-host}
      RELAYFOLD_WORKSPACE_ROOT: /workspaces
    volumes:
      - ${RELAYFOLD_HOME}/file_credentials.json:/home/relayfold/.relayfold/file_credentials.json:ro
      - ${RELAYFOLD_HOME}/skills:/home/relayfold/.pi/agent/skills:ro
      - ${RELAYFOLD_HOME}/workspaces:/workspaces
      - ${RELAYFOLD_HOME}/cache:/home/relayfold/.cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
