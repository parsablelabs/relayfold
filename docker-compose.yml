# Development stack: builds local component sources and uses external MySQL.
services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.dev
    ports:
      - "0.0.0.0:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RELAYFOLD_USE_GLOBAL_NAMESPACE: "true"
      RELAYFOLD_WORKER_HTTP_ADDR: 0.0.0.0:3001
      RELAYFOLD_STORAGE: mysql
      RELAYFOLD_STORE_MYSQL_HOST: ${RELAYFOLD_STORE_MYSQL_HOST:-host.docker.internal}
      RELAYFOLD_STORE_MYSQL_PORT: ${RELAYFOLD_STORE_MYSQL_PORT:-3306}
      RELAYFOLD_STORE_MYSQL_DATABASE: ${RELAYFOLD_STORE_MYSQL_DATABASE:-relayfold}
      RELAYFOLD_STORE_MYSQL_USERNAME: ${RELAYFOLD_STORE_MYSQL_USERNAME:-root}
      RELAYFOLD_STORE_MYSQL_PASSWORD: ${RELAYFOLD_STORE_MYSQL_PASSWORD:-pass}
      RELAYFOLD_SCHEDULER_ENABLED: false
      RELAYFOLD_SCHEDULER_CONFIG_PATH: /etc/relayfold/scheduler.yaml
      # To use SQLite instead, comment out the MySQL settings above and uncomment:
      # RELAYFOLD_STORAGE: sqlite
      # RELAYFOLD_STORE_SQLITE_PATH: /var/lib/relayfold/relayfold.db
    # Also uncomment this volume when using SQLite:
    # volumes:
    #   - relayfold-storage:/var/lib/relayfold
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null && wget -qO- http://127.0.0.1:3001/health >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 12
    volumes:
      - ./scheduler.yaml:/etc/relayfold/scheduler.yaml:ro
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      RELAYFOLD_ORCHESTRATOR_HTTP_URL: http://orchestrator:3001
      RELAYFOLD_WORKER_HOST_ID: compose-local-host
      RELAYFOLD_WORKSPACE_ROOT: /workspaces
    volumes:
      - ${HOME}/.relayfold:/home/relayfold/.relayfold:ro
      - ${RELAYFOLD_SKILLS_DIR:-${HOME}/.relayfold/skills}:/home/relayfold/.pi/agent/skills:ro
      - relayfold-workspaces:/workspaces
      - relayfold-cache:/home/relayfold/.cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: on-failure
    deploy:
      replicas: 2

volumes:
  # Used by the commented SQLite configuration above.
  relayfold-storage:
  relayfold-workspaces:
  relayfold-cache:
